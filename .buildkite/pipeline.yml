steps:
  - label: ":sparkles: Tests"
    plugins:
      - plugin-tester#v1.3.0: ~

  - label: ":lint-roller: Lint"
    plugins:
      - plugin-linter#v4.0.0:
          id: mise

  - label: ":mise: Smoke test"
    command:
      - "command -v mise"
      - "mise --version"
      - "command -v go"
      - "go version"
    plugins:
      - ./:
          dir: .buildkite/smoke

  - label: ":shell: Shellcheck"
    command: 'docker run --rm -v "$$PWD:/workdir" -w /workdir koalaman/shellcheck-alpine:v0.11.0 shellcheck hooks/*'
